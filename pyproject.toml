[project]
name = "valutatrade_hub"
version = "0.1.0"
description = "Консольный кошелёк для симуляции торговли валютами с курсами из внешних API"
readme = "README.md"
authors = [
    { name = "Daniil Bykov", email = "bykov.commerce@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
wallet = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.uv]
package = true

[tool.valutatrade]
data_dir = "data"
rates_ttl_seconds = 3900
rates_update_interval_seconds = 3600
base_currency = "USD"
log_file = "logs/actions.log"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 3

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["valutatrade_hub*"]
namespaces = false
